<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>String_Length</title>
</head>
<body>
      <h1>In built Length Method in String</h1>
      <input type="text" id="Input" placeholder="Enter Text">
      <button type="button" onclick="showLength()">Enter</button>
      <script>
        function showLength(){
        let text= document.getElementById('Input').value;
        let len=text.length;
        alert(len);
        }
      </script>
</body>
</html>
