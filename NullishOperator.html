<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nullish_Operator</title>
    <style>
        body{
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }
    </style>
</head>
<body>
        <h1> ?? Operator Use</h1>
        <input type="text" id="name" placeholder="Enter your name..">
        <button type="button" onclick="NullshiOp()">Enter</button>
        <p id ='demo'></p>
        <script>
            function NullshiOp(){
             let name=document.getElementById('name').value;
                if(name==="")
                    name=null;
             let message="Missing";
             let result=name??message;
             if(result=="Missing")
               window.alert("Name is Madatory");
             document.getElementById('demo').innerHTML="Name is "+result;
            }
        </script>
</body>
</html>
