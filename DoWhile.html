<!--Practice of Do While -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do_While_Loop</title>
</head>
<body>
         <h1>Use Of Do While</h1>
         <p id="demo"></p>
         <script>
            let text="";
            let i=0;
            do{
                 text+=i+"<br>";
                 i++;
            }while(i<=10)
document.getElementById('demo').innerHTML="<h3>Numbers From 1 To 10 : </h3>"+text;
         </script>

</body>
</html>
