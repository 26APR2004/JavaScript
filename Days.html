<!--Demonstration of Switch-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Switch</title>
</head>
<body>
         <h1> Today's Day is :</h1>
         <h2 id="demo"></h2>
         <script>
                let day_num=new Date().getDay();
                let day;
                switch(day_num)
                {
                    case 0:
                        day="Sunday";
                        break;
                    case 1:
                        day="Monday";
                        break;
                    case 2:
                        day="Tuesday";
                        break;
                    case 3:
                        day="Wednesday";
                        break;
                    case 4:
                        day="Thursday";
                        break;
                    case 5:
                        day="Fridayday";
                        break;
                    case 6:
                        day="Saturday";
                        break;
 
                }
                document.getElementById('demo').innerHTML=day;
         </script>
</body>
</html>
