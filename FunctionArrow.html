<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Function Arrow</title>
    <style>
          body
          {
            display: flex;
            flex-direction:column;
            height: 100vh;
            align-items: center;
            justify-content: center;
          }
    </style>
</head>
<body>
    <h1> Practice Function Arrow in JavaScript </h1>
    <p id="demo"></p>
    <script>
        let add=(a,b)=>a*b;       // Only For single Line Statment return and Curly-brackets not inserted
        document.getElementById('demo').innerHTML="<h2>"+add(2,3)+"<\h2>"
    </script>
    
</body>
</html>
