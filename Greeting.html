<!--Demo Of iF Elae Statment In JavaScript-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greetings</title>
   
<body>
         <h1>Greeting By Using JavaScript</h1>
         <p id ='demo'></p>
         <script>
        let time=new Date().getHours();
        let text;
              if(time<12)
                 text="Good Morning";
              else if(time<5)
                text="Good Afternoon";
              else if(time<9)
                text="Good Evening";
              else 
                text="Good Night!";
            document.getElementById('demo').innerHTML="Greeting:"+text;
    </script>
</head>
</body>
</html>
