<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ternanry Oprator</title>
</head>
<body>
       <h1>Demonstration of use Ternanry Operator</h1>
       <p id="demo"></p>
       <script>
        let price = 10;
        let isMember=true;
        let discount=isMember ? 0.2 : 0;
        let total=10-(price*discount);

        document.getElementById('demo').innerHTML="The Price Is : "+total;
       </script>
</body>
</html>
