<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>String Methods</title>
</head>
<body>
       <h1>String Methods in JavaScript</h1>
       <p id="demo"></p>
       <script>
            let  text="Hi how are you!";
            let char=text.charCodeAt('0');
            let chatat=text.at(3);
            document.getElementById('demo').innerHTML=text.charAt(1)+"<br>"+char+"<br>"+chatat;
       </script>
</body>
</html>
