<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoke Function</title>
</head>
<body>
         <h1>JavaScript Function</h1>
         <h3>A function that converts from Fahrenheit to Celsius:</h3>
         <p id="demo"></p>
         <script>
            function toCelsius( farn)
            {
                return (5/9)*(farn-32);
            }
            let value=toCelsius(77);
            document.getElementById('demo').innerHTML="The Vlalue is :"+value;
         </script>
</body>
</html>
