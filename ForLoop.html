<!--Practice of For Loop -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>for_loop</title>
</head>
<body>
      <h1> Demo Of For Loop</h1>
      <p id="demo"></p>

      <script>
              let text="";

              for(let i=0;i<10;i++)
              {
                 text+="<br>"+"Number is :"+i;
              }
              document.getElementById('demo').innerHTML="<h3>Numbers From 1 to 10 :</h3>"+text;
      </script>
</body>
</html>
