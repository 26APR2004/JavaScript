<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Function Expression</title>
    <style>
            body{
                display: flex;
                flex-direction: column;
                height: 100vh;
                align-items: center;
                justify-content: center;
            }
    </style>
</head>
<body>
       <h1>Function Expression in JavaScript</h1>
       <p id="demo"></p>
      <script>
         let multi=function(a,b){return a*b};
         document.getElementById('demo').innerHTML="<h2>"+multi(2,3);+"</h2>"
      </script>
</body>
</html>
