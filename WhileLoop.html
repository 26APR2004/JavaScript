<!--While Loop Practice-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>While_Loop</title>
</head>
<body>
        <h1>Use Of while loop</h1>
        <p id="demo"></p>
        <script>
            let text="";
            let i=0;
            while(i<=10)
        {
             text+=i+"<br>";
             i++;
        }
        document.getElementById('demo').innerHTML="<h3>Number From 1 To 1O : </h3>"+text
        </script>
</body>
</html>
