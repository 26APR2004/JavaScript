<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Templets</title>
</head>
<body>
      <h1>Use Of Templets in JavaScript</h1>
      <input type="text" id="Name" placeholder="Enter Your name...">
      <button type="button" onclick="Assistant()">Enter</button>
      <p id="output"></p>

      <script>
        function Assistant(){
             let name=document.getElementById('Name').value;
             document.getElementById('output').innerHTML=`Hello, ${name} How Can I Help You?`;
        }
             </script>
</body>
</html>
